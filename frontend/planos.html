<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planos — AURELIA</title>
  <meta name="description" content="Planos ESSENTIAL, GROWTH, SCALE e CUSTOM. Formas de engajamento com a AURELIA.">
  <link rel="canonical" href="https://aurelia.example/planos.html">
  <meta property="og:title" content="Planos — AURELIA">
  <meta name="theme-color" content="#F6F7F5">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/home.css">
  <style>
    .page-hero { padding: 4rem 0 2rem; border-bottom: 1px solid var(--border); }
    .compare-wrap { overflow-x: auto; margin-top: 3rem; }
    .compare-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; min-width: 640px; }
    .compare-table th, .compare-table td { padding: 0.75rem 1rem; border: 1px solid var(--border); text-align: left; }
    .compare-table th { font-weight: 500; background: var(--bg-elevated); }
    .compare-table td:first-child { color: var(--fg-muted); }
  </style>
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  <header class="site-header">
    <div class="container nav">
      <a href="/" class="nav-logo">AURELIA</a>
      <nav class="nav-links" aria-label="Principal">
        <a href="solucoes.html">Soluções</a>
        <a href="portfolio.html">Portfólio</a>
        <a href="planos.html" aria-current="page">Planos</a>
        <a href="processo.html">Processo</a>
        <a href="sobre.html">Sobre</a>
        <a href="faq.html">FAQ</a>
        <a href="contato.html" class="nav-cta" style="margin-top:0.5rem">Falar com a AURELIA</a>
      </nav>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Tema">◐</button>
        <a href="contato.html" class="nav-cta nav-cta-desktop">Falar com a AURELIA</a>
        <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main id="main">
    <div class="page-hero">
      <div class="container">
        <p class="section-label">Planos</p>
        <h1>Formas de engajamento</h1>
        <p class="section-lead" style="margin-top:1rem">Do essencial ao sob medida. Valores sob consulta, alinhados ao escopo real.</p>
      </div>
    </div>
    <section class="section">
      <div class="container">
        <div class="plans-grid" id="plans-grid"><div class="loading">Carregando planos…</div></div>
        <div class="compare-wrap">
          <h2 style="margin:2rem 0 1rem;font-size:1.25rem">Comparativo</h2>
          <table class="compare-table" id="compare-table">
            <thead><tr><th>Recurso</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border:none;padding-top:0"><span>© AURELIA</span></div></div></footer>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/analytics.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById('plans-grid');
      const table = document.getElementById('compare-table');
      try {
        const res = await AURELIA.api.get('/plans');
        const plans = res.data || [];
        if (!plans.length) {
          grid.innerHTML = '<div class="empty-state">Nenhum plano disponível.</div>';
          return;
        }
        grid.innerHTML = plans.map((p) => `
          <div class="plan-card ${p.is_featured ? 'is-featured' : ''}">
            <p class="plan-name">${p.name}</p>
            <h3>${p.tagline || p.name}</h3>
            <p class="plan-tagline">${p.description || ''}</p>
            <p class="plan-price">${p.price_label || 'Sob consulta'}</p>
            <a href="/contato.html?plano=${encodeURIComponent(p.slug)}" class="btn btn-secondary" data-track="plan_view" data-track-label="${p.slug}">${p.cta_label || 'Falar com a AURELIA'}</a>
          </div>
        `).join('');

        // Comparison table
        const featureKeys = {};
        plans.forEach((p) => {
          (p.features || []).forEach((f) => {
            featureKeys[f.feature_key] = f.feature_label;
          });
        });
        const thead = table.querySelector('thead tr');
        plans.forEach((p) => {
          const th = document.createElement('th');
          th.textContent = p.name;
          thead.appendChild(th);
        });
        const tbody = table.querySelector('tbody');
        Object.entries(featureKeys).forEach(([key, label]) => {
          const tr = document.createElement('tr');
          const td0 = document.createElement('td');
          td0.textContent = label;
          tr.appendChild(td0);
          plans.forEach((p) => {
            const f = (p.features || []).find((x) => x.feature_key === key);
            const td = document.createElement('td');
            td.textContent = f ? (f.feature_value || (f.is_included ? 'Sim' : '—')) : '—';
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      } catch {
        grid.innerHTML = '<div class="empty-state">Não foi possível carregar os planos.</div>';
      }
    })();
  </script>
</body>
</html>
