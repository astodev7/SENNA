<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case — SENNA</title>
  <meta name="theme-color" content="#080908">
  <link rel="icon" href="../assets/icons/senna-favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/senna-home.css?v=8.4">
  <link rel="stylesheet" href="../css/senna-pages.css?v=2">
</head>
<body class="senna senna-pages">
<a class="skip" href="#main">Ir para o conteúdo</a>
<header class="site-header" id="site-header"><div class="container nav"><a href="../index.html" class="nav-logo" aria-label="SENNA — página inicial">SENNA</a><nav class="nav-links" id="nav-links" aria-label="Principal"><a href="../solucoes.html">Soluções</a><a href="../portfolio.html">Portfólio</a><a href="../processo.html">Processo</a><a href="../sobre.html">Sobre</a><a href="../faq.html">FAQ</a><a href="../contato.html" class="nav-cta-m">Falar com a SENNA</a></nav><div class="nav-actions"><a href="../contato.html" class="nav-cta">Falar com a SENNA</a><button type="button" class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links"><span></span><span></span><span></span></button></div></div></header>
<main id="main"><div id="root" class="container page-hero"><p class="muted">Carregando case…</p></div></main>
<footer class="final" aria-label="Rodapé">
    <div class="wrap">
      <p class="tiny">Have a project?</p>
      <h2 class="display">Vamos construir o que vem depois.</h2>
      <a class="btn-ivory" href="../contato.html" data-track="cta_click" data-track-label="cta_final">Iniciar um projeto ↗</a>
      <div class="final-info">
        <span>SENNA — Technology &amp; Strategy</span>
        <a href="mailto:contato@aurelia.exemplo">contato@aurelia.exemplo</a>
        <span>São Paulo, Brasil</span>
        <span class="grow"></span>
        <a href="../privacidade.html">Privacidade</a>
        <a href="../termos.html">Termos</a>
        <a href="../cookies.html">Cookies</a>
        <span>© <span data-year></span> SENNA</span>
      </div>
    </div>
  </footer>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>

<script src="../js/nav.js"></script>
<script>
document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());
(async function(){
  const root=document.getElementById('root');
  let slug=location.pathname.split('/').filter(Boolean).pop()||'';
  if(slug.endsWith('.html')) slug=new URLSearchParams(location.search).get('slug')||'';
  if(!slug||slug==='projetos'||slug==='case') slug=new URLSearchParams(location.search).get('slug')||'';
  if(!slug){ root.innerHTML='<p class="label-mono">Indisponível</p><h1 class="display-lg">Case não encontrado</h1><p style="margin-top:1.5rem"><a class="btn btn-primary" href="../portfolio.html">Portfólio</a></p>'; return; }
  try{
    const res=await AURELIA.api.get('/projects/'+encodeURIComponent(slug));
    const p=res.data;
    if(!p) throw new Error('nf');
    document.title=p.title+' — Case SENNA';
    const techs=(p.technologies||[]).map(t=>'<li class="board-cell" style="font-family:var(--font-mono);font-size:.85rem">'+t+'</li>').join('');
    root.className='';
    root.innerHTML=`
    <section class="container page-hero">
      <p class="label-mono"><a href="../portfolio.html">Portfólio</a> · ${p.category||'Projeto'}</p>
      <h1 class="display-lg">${p.title}</h1>
      <p class="lead">${p.summary||''}</p>
      ${p.external_url?`<p style="margin-top:1.5rem"><a class="btn btn-outline" href="${p.external_url}" target="_blank" rel="noopener">Ver ao vivo ↗</a></p>`:''}
    </section>
    ${p.problem?`<section class="section"><div class="container"><p class="label-mono">Problema</p><h2 class="display-md" style="margin-top:.75rem">O que estava travando</h2><p style="margin-top:1.25rem;font-size:1.05rem;line-height:1.65;max-width:40rem">${p.problem}</p>${p.context?`<p class="muted" style="margin-top:1rem;max-width:40rem">${p.context}</p>`:''}</div></section>`:''}
    ${p.solution?`<section class="section section-surface"><div class="container"><p class="label-mono">Solução</p><h2 class="display-md" style="margin-top:.75rem">O que construímos</h2><p style="margin-top:1.25rem;font-size:1.05rem;line-height:1.65;max-width:40rem">${p.solution}</p>${p.architecture?`<p class="label-mono" style="margin-top:1.75rem">Arquitetura</p><p class="muted" style="margin-top:.75rem;max-width:40rem">${p.architecture}</p>`:''}</div></section>`:''}
    ${techs?`<section class="section"><div class="container"><p class="label-mono">Tecnologias</p><h2 class="display-md" style="margin-top:.75rem">Stack</h2><ul class="board board-4" style="margin-top:1.5rem">${techs}</ul></div></section>`:''}
    ${p.results?`<section class="section section-surface"><div class="container"><p class="label-mono">Resultado</p><h2 class="display-md" style="margin-top:.75rem">O que mudou</h2><p style="margin-top:1.25rem;max-width:40rem;line-height:1.65">${p.results}</p></div></section>`:''}
    <section class="section section-invert"><div class="container cta-row"><div><h2 class="display-lg">Quer um resultado parecido?</h2><p>Conte o problema. Desenhamos o caminho técnico.</p></div><a class="btn btn-invert" href="../contato.html">Falar com a SENNA</a></div></section>`;
  }catch(e){
    root.innerHTML='<p class="label-mono">Indisponível</p><h1 class="display-lg">Este case não está publicado</h1><p style="margin-top:1.5rem"><a class="btn btn-primary" href="../portfolio.html">Portfólio</a></p>';
  }
})();
</script>
</body></html>
