<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto — AURELIA</title>
  <meta name="description" content="Case study AURELIA">
  <meta name="theme-color" content="#F6F7F5">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/home.css">
  <style>
    .case-hero { padding: 4rem 0 3rem; border-bottom: 1px solid var(--border); }
    .case-meta { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
    .case-section { padding: 2.5rem 0; border-bottom: 1px solid var(--border); }
    .case-section h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    .case-section p { color: var(--fg-muted); max-width: 40rem; }
    .tech-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .tech-list span { padding: 0.35rem 0.75rem; border: 1px solid var(--border); font-size: 0.8125rem; }
  </style>
  <script src="../js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="nav-logo">AURELIA</a>
      <nav class="nav-links" aria-label="Principal">
        <a href="../solucoes.html">Soluções</a>
        <a href="../portfolio.html">Portfólio</a>
        <a href="../planos.html">Planos</a>
        <a href="../processo.html">Processo</a>
        <a href="../sobre.html">Sobre</a>
        <a href="../faq.html">FAQ</a>
        <a href="../contato.html" class="nav-cta" style="margin-top:0.5rem">Falar com a AURELIA</a>
      </nav>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Tema">◐</button>
        <a href="../contato.html" class="nav-cta nav-cta-desktop">Falar com a AURELIA</a>
        <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main id="main">
    <div id="case-content"><div class="loading container" style="padding:4rem 0">Carregando projeto…</div></div>
  </main>
  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border:none;padding-top:0"><span>© AURELIA</span></div></div></footer>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/analytics.js"></script>
  <script>
    (async function () {
      const slug = location.pathname.split('/').filter(Boolean).pop();
      const el = document.getElementById('case-content');
      try {
        const res = await AURELIA.api.get('/projects/' + encodeURIComponent(slug));
        const p = res.data;
        document.title = (p.meta_title || p.title + ' — AURELIA');
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.content = p.meta_description || p.summary || '';
        const techs = (p.technologies || []).map((t) => '<span>' + t + '</span>').join('');
        el.innerHTML = `
          <div class="case-hero"><div class="container">
            <p class="case-meta">${p.category || ''} · Projeto</p>
            <h1>${p.title}</h1>
            <p class="section-lead" style="margin-top:1rem">${p.summary || ''}</p>
          </div></div>
          ${p.problem ? `<section class="case-section"><div class="container"><h2>Problema</h2><p>${p.problem}</p></div></section>` : ''}
          ${p.context ? `<section class="case-section"><div class="container"><h2>Contexto</h2><p>${p.context}</p></div></section>` : ''}
          ${p.solution ? `<section class="case-section"><div class="container"><h2>Solução</h2><p>${p.solution}</p></div></section>` : ''}
          ${p.architecture ? `<section class="case-section"><div class="container"><h2>Arquitetura</h2><p>${p.architecture}</p></div></section>` : ''}
          ${techs ? `<section class="case-section"><div class="container"><h2>Tecnologias</h2><div class="tech-list">${techs}</div></div></section>` : ''}
          ${p.results ? `<section class="case-section"><div class="container"><h2>Resultados</h2><p>${p.results}</p></div></section>` : ''}
          <section class="cta-final"><div class="container">
            <h2>Projeto semelhante?</h2>
            <p>Conte o contexto. Avaliamos encaixe e próximos passos.</p>
            <a href="../contato.html" class="btn btn-primary">Falar com a AURELIA</a>
          </div></section>
        `;
        if (window.AURELIA?.analytics) AURELIA.analytics.track('portfolio_view', { slug });
      } catch {
        el.innerHTML = '<div class="container" style="padding:4rem 0"><div class="empty-state">Projeto não encontrado.</div><p style="margin-top:1rem"><a href="../portfolio.html">Voltar ao portfólio</a></p></div>';
      }
    })();
  </script>
</body>
</html>
