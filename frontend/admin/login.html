<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — AURELIA</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .login-box { width: 100%; max-width: 380px; padding: 2rem; border: 1px solid var(--border); background: var(--surface); }
    .login-box h1 { font-family: var(--font-body); font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); margin-bottom: 0.35rem; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); background: var(--bg); }
    .btn { width: 100%; padding: 0.75rem; background: var(--fg); color: var(--bg); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.5rem; }
    .btn:disabled { opacity: 0.6; }
    .err { color: var(--danger); font-size: 0.875rem; margin-top: 1rem; }
  </style>
  <script src="../js/theme.js"></script>
</head>
<body>
  <form class="login-box" id="login-form">
    <h1>AURELIA Admin</h1>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn">Entrar</button>
    <p class="err" id="err" hidden></p>
  </form>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      err.hidden = true;
      btn.disabled = true;
      try {
        await AURELIA.api.post('/admin/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        location.href = '/admin/';
      } catch (ex) {
        err.textContent = ex.message || 'Falha no login';
        err.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
