<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads — AURELIA Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin/admin.css">
  <script src="/js/theme.js"></script>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand">AURELIA</div>
      <nav>
        <a href="/admin/">Dashboard</a>
        <a href="/admin/leads.html" class="is-active">Leads</a>
        <a href="/admin/projects.html">Projetos</a>
        <a href="/admin/plans.html">Planos</a>
        <a href="/admin/faq.html">FAQ</a>
        <a href="/admin/settings.html">Configurações</a>
      </nav>
      <button type="button" class="admin-logout" id="logout">Sair</button>
    </aside>
    <div class="admin-main">
      <header class="admin-top"><h1>Leads</h1></header>
      <div class="admin-toolbar">
        <input type="search" id="search" placeholder="Buscar…" aria-label="Buscar">
        <select id="status-filter" aria-label="Status">
          <option value="">Todos</option>
          <option value="novo">Novo</option>
          <option value="em_analise">Em análise</option>
          <option value="contato_realizado">Contato realizado</option>
          <option value="proposta">Proposta</option>
          <option value="fechado">Fechado</option>
          <option value="arquivado">Arquivado</option>
        </select>
      </div>
      <div id="content"><div class="loading">Carregando…</div></div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('logout').addEventListener('click', async () => {
      try { await AURELIA.api.post('/admin/auth/logout'); } catch (_) {}
      location.href = '/admin/login.html';
    });
    async function load() {
      const search = document.getElementById('search').value;
      const status = document.getElementById('status-filter').value;
      const q = new URLSearchParams();
      if (search) q.set('search', search);
      if (status) q.set('status', status);
      try {
        const res = await AURELIA.api.get('/admin/contacts?' + q.toString());
        const items = res.data || [];
        if (!items.length) {
          document.getElementById('content').innerHTML = '<div class="empty-state">Nenhum lead encontrado.</div>';
          return;
        }
        document.getElementById('content').innerHTML = `
          <table class="admin-table">
            <thead><tr><th>Nome</th><th>Empresa</th><th>E-mail</th><th>Projeto</th><th>Status</th><th>Data</th><th></th></tr></thead>
            <tbody>
              ${items.map((l) => `
                <tr>
                  <td>${l.name}</td>
                  <td>${l.company || '—'}</td>
                  <td>${l.email}</td>
                  <td>${l.project_type || '—'}</td>
                  <td>
                    <select data-id="${l.id}" class="status-sel" style="font-size:0.75rem;padding:0.25rem">
                      ${['novo','em_analise','contato_realizado','proposta','fechado','arquivado'].map((s) =>
                        `<option value="${s}" ${l.status === s ? 'selected' : ''}>${s}</option>`
                      ).join('')}
                    </select>
                  </td>
                  <td>${new Date(l.created_at).toLocaleDateString('pt-BR')}</td>
                  <td><button type="button" class="btn-sm" data-view="${l.id}">Ver</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        document.querySelectorAll('.status-sel').forEach((sel) => {
          sel.addEventListener('change', async () => {
            try {
              await AURELIA.api.patch('/admin/contacts/' + sel.dataset.id, { status: sel.value });
            } catch (e) {
              alert(e.message || 'Erro ao atualizar');
            }
          });
        });
        document.querySelectorAll('[data-view]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const r = await AURELIA.api.get('/admin/contacts/' + btn.dataset.view);
            const c = r.data;
            alert(`${c.name}\n${c.email}\n${c.phone || ''}\n\n${c.message}`);
          });
        });
      } catch (e) {
        if (e.status === 401) location.href = '/admin/login.html';
        else document.getElementById('content').innerHTML = '<div class="empty-state">Erro ao carregar.</div>';
      }
    }
    document.getElementById('search').addEventListener('input', () => { clearTimeout(window._t); window._t = setTimeout(load, 300); });
    document.getElementById('status-filter').addEventListener('change', load);
    load();
  </script>
</body>
</html>
